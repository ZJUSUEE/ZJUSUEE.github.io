name: ci 
on:
  push:
    branches:
      - master 
      - main
permissions:
  contents: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'ZJUSUEE/ZJUSUEE.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
      - uses: actions/cache@v3
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: mkdocs build --strict
      - name: Upload and verify document materials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_materials.py site --upload --report materials-report.json
      - run: python -m ghp_import -n -p -f site
